{% extends "base.html" %}

{% block title %}이벤트를 찾을 수 없습니다 - VoteEvent{% endblock %}

{% block content %}
<div class="max-w-xl mx-auto px-4 py-20 text-center">
    <div class="w-20 h-20 bg-rose-50 text-rose-500 rounded-3xl flex items-center justify-center mx-auto mb-6 text-3xl shadow-inner">
        <i class="fa-solid fa-triangle-exclamation"></i>
    </div>
    <h1 class="text-3xl font-extrabold text-slate-900 tracking-tight">이벤트를 찾을 수 없습니다</h1>
    <p class="text-slate-500 mt-2 text-sm leading-relaxed">
        접속하신 주소 <code class="bg-slate-100 text-rose-600 px-1.5 py-0.5 rounded font-mono">{{ request.url.path }}</code> 에 해당하는 투표 이벤트가 존재하지 않거나 비활성화되었습니다.
    </p>
    <div class="mt-8 flex justify-center gap-3">
        <a href="{{ default_prefix }}/" class="px-5 py-2.5 bg-brand-500 hover:bg-brand-600 text-white text-sm font-semibold rounded-xl shadow-sm shadow-brand-500/30 transition flex items-center gap-2">
            <i class="fa-solid fa-house"></i>
            <span>이벤트 목록으로 가기</span>
        </a>
    </div>
</div>
{% endblock %}
